){let i=s.order[s.pos];if(i===undefined||!window.speechSynthesis)return;let u=new SpeechSynthesisUtterance(words[i][0]);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}function render(){refresh();save();let count=Object.keys(s.done).length; $('overall').textContent=`習得 ${count} / ${words.length} ・ 苦手 ${Object.keys(s.wrong).length}語`;$('totalbar').style.width=count/words.length*100+'%';$('set').innerHTML=names.map((n,i)=>`<option value="${i}" ${i===s.set?'selected':''} ${unlocked(i)?'':'disabled'}>セット ${i+1}：${n} (${Object.keys(s.done).filter(k=>+k>=i*50&&+k<(i+1)*50).length}/${Math.min(50,words.length-i*50)}) ${unlocked(i)?'':'🔒'}</option>`).join('');for(let [id,t] of [['study','study'],['review','review'],['listbtn','list'],['past','past'],['quiz','quiz']])$(id).classList.toggle('active',s.tab===t);$('dir').textContent=s.reverse?'日本語 → 英語':'英語 → 日本語';$('status').textContent=s.tab==='list'?`全${words.length}項目`:`残り ${s.order.length} 語`;if(s.tab==='list'){$('panel').innerHTML='<input id="query" placeholder="英語・日本語で検索" oninput="listWords()"><div id="list"></div>';listWords();return}let i=s.order[s.pos];if(i===undefined){$('panel').innerHTML=`<div class="card"><h2>${s.tab==='study'?'セットクリア！':'復習する単語はありません'}</h2>${s.tab==='study'&&s.set<names.length-1?'<button class="primary" onclick="s.set++;mode(\'study\')">次のセットへ</button>':''}</div>`;return}let w=words[i];if(s.tab==='quiz'){if(quizKey!==i){quizKey=i;feedback="";let k=s.reverse?0:1;let candidates=[...new Set(words.slice(s.set*50,s.set*50+50).map(x=>x[k]).filter(x=>x!==w[k]))];if(candidates.length<3)candidates=[...new Set(words.map(x=>x[k]).filter(x=>x!==w[k]))];choices=[w[k],...candidates.sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5)}$('panel').innerHTML=`<div class="card"><small>4択テスト</small><div class="word">${w[s.reverse?1:0]}</div><div id="opts" style="display:grid;gap:8px"></div><p>${feedback}</p>${feedback?'<button class="primary" onclick="mark(quizCorrect)">次へ</button>':''}</
